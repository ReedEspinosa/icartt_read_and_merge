[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icartt-read-and-merge"
version = "0.1.0"
description = "Read and merge ICARTT files as pandas DataFrames with automatic time parsing and timezone handling"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Jessica D. Haskins", email = "jhaskins@alum.mit.edu"}
]
keywords = ["icartt", "data", "pandas", "atmospheric", "science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "mpu",
    "matplotlib>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/jdhaskins/icartt_read_and_merge"
Repository = "https://github.com/jdhaskins/icartt_read_and_merge"
Issues = "https://github.com/jdhaskins/icartt_read_and_merge/issues"

[tool.setuptools]
packages = ["icartt_read_and_merge"]

[tool.setuptools.package-data]
"*" = ["*.md", "LICENSE"]

